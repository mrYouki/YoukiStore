<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YoukiStore — YoukiShell Extension Marketplace</title>
<link rel="icon" type="image/png" href="assets/icon.png">
<style>
  :root{
    --bg: #ffffff;
    --panel: #ffffff;
    --border: #e2e2e2;
    --text: #0a0a0a;
    --text-dim: #6b6b6b;
    --black: #111111;
    --grey-fill: #f2f2f2;
    --radius: 4px;
  }
  *{box-sizing:border-box; min-width:0; -webkit-tap-highlight-color:transparent;}
  html{ overflow-x:hidden; }
  body{
    margin:0;
    font-family: -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
    overflow-x:hidden;
  }
  a{color:inherit; text-decoration:none;}
  img{max-width:100%; display:block;}

  header.topbar{
    background:var(--black);
    padding:12px 16px;
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
  }
  .brand{
    display:flex; align-items:center; gap:8px;
    font-weight:800; font-size:16px;
    color:#fff;
    letter-spacing:.01em;
    flex-shrink:0;
  }
  .brand .mark{
    width:34px; height:34px;
    background:#000;
    border:1px solid #333;
    border-radius:9px;
    display:flex; align-items:center; justify-content:center;
    color:#fff;
    flex-shrink:0;
    overflow:hidden;
  }
  .brand .mark img{ width:100%; height:100%; object-fit:cover; }
  .brand .mark svg{ width:70%; height:70%; }
  .search{ order:3; flex-basis:100%; }
  .search input{
    width:100%;
    padding:9px 12px;
    border:1px solid #333;
    border-radius:var(--radius);
    font-size:14px;
    background:#1a1a1a;
    color:#fff;
  }
  .search input::placeholder{ color:#999; }
  .gh-link-btn{
    background:#fff;
    color:#111;
    padding:7px 14px;
    border-radius:var(--radius);
    font-size:12.5px;
    font-weight:700;
    display:flex; align-items:center; gap:6px;
    white-space:nowrap;
    margin-inline-start:auto;
    flex-shrink:0;
  }

  @media (min-width:720px){
    header.topbar{ padding:14px 24px; gap:0; flex-wrap:nowrap; }
    .brand{ font-size:17px; }
    .search{ order:0; flex-basis:auto; flex:1; max-width:420px; margin:0 24px; }
    .gh-link-btn{ margin-inline-start:0; padding:8px 16px; font-size:13px; }
  }

  .wrap{ max-width:1100px; margin:0 auto; padding:16px; }
  @media (min-width:720px){ .wrap{ padding:24px; } }

  .page-head{ margin-bottom:16px; border-bottom:2px solid var(--black); padding-bottom:12px; }
  .page-head h1{ font-size:19px; margin:0 0 4px; font-weight:800; }
  .page-head p{ color:var(--text-dim); font-size:12.5px; margin:0; }

  .filters{
    display:flex; gap:0; margin-bottom:16px;
    overflow-x:auto;
    border-bottom:1px solid var(--border);
    -ms-overflow-style:none; scrollbar-width:none;
  }
  .filters::-webkit-scrollbar{ display:none; }
  .filter-chip{
    padding:9px 14px;
    font-size:12.5px;
    color:var(--text-dim);
    font-weight:600;
    border-bottom:2px solid transparent;
    margin-bottom:-1px;
    white-space:nowrap;
    flex-shrink:0;
    cursor:pointer;
  }
  .filter-chip.active{ color:var(--black); border-bottom-color:var(--black); }

  .grid{
    display:grid;
    grid-template-columns:1fr;
    gap:0;
    border-top:1px solid var(--border);
  }
  @media (min-width:560px){
    .grid{ grid-template-columns:repeat(2,1fr); border-inline-start:1px solid var(--border); }
  }
  @media (min-width:860px){
    .grid{ grid-template-columns:repeat(3,1fr); }
  }
  .card{
    background:var(--panel);
    border-inline-end:1px solid var(--border);
    border-bottom:1px solid var(--border);
    padding:16px;
    display:flex;
    flex-direction:column;
    gap:9px;
    cursor:pointer;
  }
  .card:hover{ background:var(--grey-fill); }

  .card-skeleton{ cursor:default; gap:10px; min-height:96px; justify-content:center; }
  .card-skeleton:hover{ background:var(--panel); }
  .skeleton-line{
    height:11px;
    border-radius:3px;
    background:linear-gradient(90deg, var(--grey-fill) 25%, #e8e8e8 37%, var(--grey-fill) 63%);
    background-size:400% 100%;
    animation:skeleton-shimmer 1.4s ease infinite;
  }
  @keyframes skeleton-shimmer{
    0%{ background-position:100% 50%; }
    100%{ background-position:0 50%; }
  }

  .card-top{ display:flex; gap:10px; align-items:center; }
  .icon{
    width:40px; height:40px;
    border-radius:var(--radius);
    background:var(--black);
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:16px; flex-shrink:0;
    font-weight:800;
    overflow:hidden;
  }
  .icon img{ width:100%; height:100%; object-fit:cover; }
  .card-title{ font-size:14px; font-weight:700; }
  .card-author{ font-size:11.5px; color:var(--text-dim); }
  .card-meta{
    display:flex; justify-content:space-between; align-items:center;
    font-size:12px; color:var(--text-dim);
    margin-top:auto; padding-top:9px;
    border-top:1px solid var(--border);
  }
  .star-badge{
    display:inline-flex; align-items:center; gap:4px;
    background:var(--black); color:#fff;
    padding:2px 7px; border-radius:3px;
    font-weight:700; font-size:11px;
  }

  .detail{ display:none; }
  .detail.show{ display:block; }

  .detail-head{
    padding:16px 0;
    display:flex; flex-wrap:wrap;
    gap:14px; align-items:flex-start;
    border-bottom:2px solid var(--black);
  }
  .detail-icon{
    width:56px; height:56px; border-radius:var(--radius);
    background:var(--black); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:22px; flex-shrink:0; font-weight:800;
    overflow:hidden;
  }
  .detail-icon img{ width:100%; height:100%; object-fit:cover; }
  .detail-title-block{ flex:1; min-width:160px; }
  .detail-title{ font-size:19px; font-weight:800; margin:0 0 4px;}
  .detail-sub{ font-size:12.5px; color:var(--text-dim); }

  .detail-actions{ display:flex; gap:8px; width:100%; }
  .btn{
    padding:11px 16px;
    border-radius:var(--radius);
    font-size:13px;
    font-weight:700;
    text-align:center;
    border:1.5px solid var(--black);
    cursor:pointer;
    white-space:nowrap;
    flex:1;
    display:inline-block;
  }
  .btn-primary{ background:var(--black); color:#fff; }
  .btn-ghost{ background:#fff; color:var(--black); }

  @media (min-width:640px){
    .detail-head{ padding:24px 0; flex-wrap:nowrap; }
    .detail-icon{ width:68px; height:68px; font-size:26px; }
    .detail-title{ font-size:23px; }
    .detail-sub{ font-size:13px; }
    .detail-actions{ margin-inline-start:auto; width:auto; flex-direction:column; }
    .btn{ flex:none; }
  }

  .detail-body{ display:grid; grid-template-columns:1fr; gap:0; }
  @media (min-width:760px){ .detail-body{ grid-template-columns:2fr 1fr; } }
  .detail-main{ padding:18px 0; }
  @media (min-width:760px){
    .detail-main{ padding:22px 24px 22px 0; border-inline-end:1px solid var(--border); }
  }
  .detail-side{ padding:0 0 18px; }
  @media (min-width:760px){ .detail-side{ padding:22px 0 22px 24px; } }

  .shots{
    display:flex; gap:8px; overflow-x:auto; margin-bottom:20px;
    -ms-overflow-style:none; scrollbar-width:none;
  }
  .shots::-webkit-scrollbar{ display:none; }
  .shot{
    width:200px; height:120px; flex-shrink:0;
    background:var(--grey-fill);
    border-radius:var(--radius);
    border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    color:var(--text-dim); font-size:12px;
    overflow:hidden;
  }
  .shot img, .shot video{ width:100%; height:100%; object-fit:cover; }

  .readme-label{
    display:flex; align-items:center; gap:6px; flex-wrap:wrap;
    font-size:12px; font-weight:700; color:var(--text-dim);
    padding-bottom:10px; margin-bottom:14px;
    border-bottom:1px solid var(--border);
  }
  .readme-file-icon{ font-size:13px; color:var(--black); }
  .readme-src{ font-weight:400; font-size:11px; color:#9a9a9a; }
  .readme{ font-size:14px; line-height:1.75; color:#1c1c1c; }
  .readme h3{ font-size:15px; margin:20px 0 8px; font-weight:800; }
  .readme p{ margin:0 0 12px; }
  .readme code{
    background:var(--grey-fill); padding:2px 5px; border-radius:3px; font-size:12.5px;
    border:1px solid var(--border);
    word-break:break-all;
  }
  .readme pre{
    background:var(--grey-fill); border:1px solid var(--border); border-radius:var(--radius);
    padding:12px; overflow-x:auto; margin:0 0 12px;
  }
  .readme pre code{ background:none; border:none; padding:0; }

  .side-block{ margin-bottom:20px; }
  .side-block h4{
    font-size:11px; text-transform:uppercase; letter-spacing:.05em;
    color:var(--text-dim); margin:0 0 10px; font-weight:800;
  }
  .kv{ display:flex; justify-content:space-between; font-size:13px; padding:6px 0; border-bottom:1px solid var(--border); }
  .kv span:first-child{ color:var(--text-dim); }

  .gh-box{
    display:flex; align-items:center; gap:10px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:12px 14px;
    background:var(--grey-fill);
  }
  .gh-mark{
    width:14px; height:14px;
    display:inline-block;
    vertical-align:-2px;
    color:currentColor;
  }
  .gh-box .gh-icon{ font-size:20px; flex-shrink:0; display:flex; }
  .gh-box .gh-icon .gh-mark{ width:22px; height:22px; vertical-align:0; color:var(--black); }
  .gh-box .gh-count{ font-size:18px; font-weight:800; line-height:1.1; }
  .gh-box .gh-label{ font-size:11px; color:var(--text-dim); }
  .gh-box .gh-link{
    margin-inline-start:auto;
    font-size:11.5px;
    font-weight:700;
    color:var(--black);
    border:1px solid var(--black);
    padding:5px 9px;
    border-radius:3px;
    white-space:nowrap;
    cursor:pointer;
  }

  .back-link{
    display:inline-flex; align-items:center; gap:4px;
    font-size:13px; color:var(--text-dim); margin-bottom:12px; cursor:pointer;
    font-weight:600;
  }

  .empty-state{
    padding:48px 24px;
    color:var(--text-dim);
    font-size:13.5px;
    line-height:1.7;
    text-align:center;
    grid-column:1/-1;
    max-width:420px;
    margin:0 auto;
  }
</style>
</head>
<body>

<script>
// Fallback brand mark: a hand-drawn SVG copy of the ship's-wheel icon,
// used only if assets/icon.png fails to load (e.g. file missing, wrong
// path, or the site is opened from somewhere that can't reach it).
// Defined here, before the header markup, so it's guaranteed to exist
// by the time the <img>'s onerror could possibly fire.
window.FALLBACK_MARK_SVG = `<svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/><line x1="7.1" y1="7.1" x2="16.9" y2="16.9"/><line x1="16.9" y1="7.1" x2="7.1" y2="16.9"/></g><g fill="currentColor"><circle cx="12" cy="3.6" r="1.3"/><circle cx="12" cy="20.4" r="1.3"/><circle cx="3.6" cy="12" r="1.3"/><circle cx="20.4" cy="12" r="1.3"/><circle cx="6.2" cy="6.2" r="1.3"/><circle cx="17.8" cy="17.8" r="1.3"/><circle cx="17.8" cy="6.2" r="1.3"/><circle cx="6.2" cy="17.8" r="1.3"/></g></svg>`;
</script>

<header class="topbar">
  <div class="brand"><div class="mark" id="brandMark"><img src="assets/icon.png" alt="YoukiStore" onerror="this.parentElement.innerHTML=window.FALLBACK_MARK_SVG;"></div> YoukiStore</div>
  <div class="search"><input type="text" id="searchInput" placeholder="Search extensions…"></div>
</header>

<div class="wrap">

  <div id="listing">
    <div class="page-head">
      <h1>Extensions</h1>
      <p>Community-built extensions for the YoukiShell app</p>
    </div>

    <div class="filters" id="filters">
      <div class="filter-chip active" data-filter="all">All</div>
      <div class="filter-chip" data-filter="top">Top Rated</div>
      <div class="filter-chip" data-filter="recent">Recent</div>
    </div>

    <div class="grid" id="grid">
      <div class="empty-state" id="loadingState">Loading extensions…</div>
    </div>
  </div>

  <div id="detailWrap" style="display:none;">
    <div class="back-link" onclick="showListing()">‹ Back to list</div>
    <div class="detail show" id="detail"></div>
  </div>

</div>

<script>
// =======================================================================
// CONFIG — point these at the real data repo once it exists.
// index.json lives in the data repo and is the single request that
// returns the summary of every extension (name, desc, stars, repo, etc).
// README + screenshots are fetched per-extension, only when that
// extension's detail page is opened — not for all 300 up front.
// =======================================================================
const DATA_REPO = "mrYouki/YoukiStore";
const DATA_BRANCH = "main";
const INDEX_URL = `https://cdn.jsdelivr.net/gh/${DATA_REPO}@${DATA_BRANCH}/index.json`;

let indexPointers = []; // [{id, repo}, ...] from index.json — lightweight, loaded once
const manifestCache = new Map(); // id -> resolved extension object, kept for the whole session

function formatStars(n){
  if(n >= 1000) return (n/1000).toFixed(1).replace(/\.0$/,'') + 'k';
  return String(n);
}

function formatUpdated(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d)) return '—';
  const days = Math.floor((Date.now() - d.getTime()) / 86400000);
  if(days <= 0) return 'today';
  if(days === 1) return '1 day ago';
  if(days < 30) return `${days} days ago`;
  const months = Math.floor(days / 30);
  if(months < 12) return months === 1 ? '1 month ago' : `${months} months ago`;
  const years = Math.floor(months / 12);
  return years === 1 ? '1 year ago' : `${years} years ago`;
}

// Renders an extension's icon as a real image using the iconUrl already
// stored in index.json (built once by the submission bot). If that URL
// is missing or fails to load, falls back to the text/symbol glyph so
// the layout never breaks or shows a blank box.
function iconHtml(iconUrl, fallbackGlyph, sizeClass){
  const fallback = (fallbackGlyph || "●").replace(/'/g, "&#39;");
  if(!iconUrl){
    return `<div class="${sizeClass}">${fallback}</div>`;
  }
  return `<div class="${sizeClass}" data-fallback="${fallback}">
      <img src="${iconUrl}" alt=""
           onerror="const p=this.parentElement; p.textContent=p.dataset.fallback; this.remove();">
    </div>`;
}

// The GitHub mark, drawn once as SVG and reused everywhere instead of
// the GitHub emoji, so it renders identically across all devices/fonts.
const GH_MARK = `<svg class="gh-mark" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
    0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
    -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66
    .07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15
    -.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27
    .68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12
    .51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48
    0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42
    -3.58-8-8-8z"/>
</svg>`;

// ===== Step 1: one lightweight request — just pointers for every
// extension (id + CDN URLs built by the submission bot). This is the
// only thing loaded for the whole catalog up front, so it stays small
// even at hundreds of entries. =====
//
// indexLoadError tracks WHY the list might be empty, so the UI can tell
// "no extensions submitted yet" (index.json loaded fine, just empty)
// apart from "couldn't reach index.json at all" (network/404/parse
// error) — these need different messages for the visitor.
let indexLoadError = null;

async function loadIndex(){
  try{
    const res = await fetch(INDEX_URL, { cache: "no-store" });
    if(!res.ok) throw new Error("index.json not reachable (status " + res.status + ")");
    const data = await res.json();
    indexPointers = data.extensions || data; // support either {extensions:[...]} or a bare array
    if(!Array.isArray(indexPointers)) throw new Error("index.json did not contain an array");
  } catch(err){
    console.warn("Could not load index.json:", err.message);
    indexPointers = [];
    indexLoadError = err.message;
  }
}

// ===== Step 2: build ONE extension's display object straight from its
// index.json pointer entry — no plugin.json fetch, no per-card network
// request. Every field the UI needs (name, stars, last-updated, icon,
// readme/release URLs) is already stored in index.json by the submission
// bot, so this is a synchronous, zero-cost lookup. Kept as an async
// function (and still cached) so call sites don't need to change. =====
function resolveExtension(pointer){
  if(manifestCache.has(pointer.id)) return manifestCache.get(pointer.id);

  const resolved = {
    id: pointer.id,
    repo: pointer.repo,
    name: pointer.name || (pointer.repo || "unknown/unknown").split('/')[1],
    author: (pointer.repo || "unknown/unknown").split('/')[0],
    icon: "●",
    iconUrl: pointer.iconUrl || null,
    readmeUrl: pointer.readmeUrl || null,
    mediaUrls: pointer.mediaUrls || [],
    releaseUrl: pointer.releaseUrl || null,
    releaseTag: pointer.releaseTag || null,
    ghStars: pointer.ghStars || 0,
    updatedAt: pointer.updatedAt || null,
  };
  manifestCache.set(pointer.id, resolved);
  return Promise.resolve(resolved);
}

// ===== Step 3: per-extension fetch, only called when that extension's
// detail page is opened. Pulls README.md and the media gallery, all from
// URLs already stored in index.json (no path-guessing on the client). =====
async function loadExtensionDetail(e){
  let readmeHtml = `<p style="color:var(--text-dim);">Could not load README.md for this extension.</p>`;
  try{
    if(!e.readmeUrl) throw new Error("no readmeUrl in index.json for this entry");
    const res = await fetch(e.readmeUrl, { cache: "no-store" });
    if(res.ok){
      const raw = await res.text();
      readmeHtml = simpleMarkdownToHtml(raw);
    }
  } catch(err){
    console.warn("README fetch failed for", e.repo, err.message);
  }

  // Media gallery: uses the exact URLs stored in index.json by the
  // submission bot — supports images, gifs, and video files together.
  const media = (e.mediaUrls && e.mediaUrls.length)
    ? e.mediaUrls.map(url => ({ url, kind: mediaKind(url) }))
    : [];

  return { readmeHtml, media };
}

// Classifies a media URL by its file extension so the gallery knows
// whether to render an <img>, a looping <video> (for mp4/webm demo
// clips), or treat a .gif as an image (browsers animate <img> gifs
// natively, no <video> tag needed).
function mediaKind(url){
  const ext = url.split('.').pop().toLowerCase();
  if(["mp4","webm","mov"].includes(ext)) return "video";
  if(["png","jpg","jpeg","gif","webp"].includes(ext)) return "image";
  return "image";
}

// Minimal Markdown to HTML so README.md renders without pulling in a full
// library. Covers headings, paragraphs, inline code, and code blocks —
// enough for typical extension READMEs. Swap for marked.js later if
// richer formatting is needed.
function simpleMarkdownToHtml(md){
  const escape = (s) => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  let html = escape(md);
  html = html.replace(/```([\s\S]*?)```/g, (_, code) => `<pre><code>${code.trim()}</code></pre>`);
  html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
  html = html.replace(/^### (.*)$/gm, "<h4>$1</h4>");
  html = html.replace(/^## (.*)$/gm, "<h3>$1</h3>");
  html = html.replace(/^# (.*)$/gm, "<h3>$1</h3>");
  html = html.split(/\n{2,}/).map(block => {
    if(/^<h[34]>/.test(block) || /^<pre>/.test(block)) return block;
    return `<p>${block.trim().replace(/\n/g, "<br>")}</p>`;
  }).join("\n");
  return html;
}

const grid = document.getElementById('grid');

// ===== Lazy card rendering =====
// Every pointer gets an empty skeleton card immediately. An
// IntersectionObserver watches the grid; a card's plugin.json is only
// fetched (and cached forever after) once that specific card actually
// scrolls into the user's viewport — not for all 300 at page load.
let cardObserver = null;

function getObserver(){
  if(cardObserver) return cardObserver;
  cardObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if(!entry.isIntersecting) return;
      const cardEl = entry.target;
      cardObserver.unobserve(cardEl);
      fillCard(cardEl);
    });
  }, { root: null, rootMargin: "200px", threshold: 0.01 });
  return cardObserver;
}

async function fillCard(cardEl){
  const pointer = { id: cardEl.dataset.id, repo: cardEl.dataset.repo };
  const e = await resolveExtension(pointer);
  cardEl.innerHTML = `
    <div class="card-top">
      ${iconHtml(e.iconUrl, e.icon, 'icon')}
      <div>
        <div class="card-title">${e.name}</div>
        <div class="card-author">${e.author}</div>
      </div>
    </div>
    <div class="card-meta">
      <span class="star-badge">${formatStars(e.ghStars)} stars</span>
      <span>updated ${formatUpdated(e.updatedAt)}</span>
    </div>
  `;
  cardEl.classList.remove('card-skeleton');
  cardEl.onclick = () => showDetail(e.id);
}

function renderGrid(pointers){
  if(pointers.length === 0){
    grid.innerHTML = emptyStateHtml();
    return;
  }
  grid.innerHTML = pointers.map(p => `
    <div class="card card-skeleton" data-id="${p.id}" data-repo="${p.repo}">
      <div class="skeleton-line" style="width:60%"></div>
      <div class="skeleton-line" style="width:90%"></div>
      <div class="skeleton-line" style="width:40%"></div>
    </div>
  `).join('');

  const observer = getObserver();
  grid.querySelectorAll('.card-skeleton').forEach(cardEl => observer.observe(cardEl));
}

// Picks the right empty-state message depending on WHY the grid is
// empty: index.json failed to load at all, the catalog is genuinely
// empty (no submissions yet), or a search/filter just matched nothing.
function emptyStateHtml(){
  const activeChip = document.querySelector('.filter-chip.active');
  const f = activeChip ? activeChip.dataset.filter : 'all';
  const q = document.getElementById('searchInput').value.trim();
  const isFilteredView = f !== 'all' || q.length > 0;

  if(indexLoadError){
    return `<div class="empty-state">Couldn't load the extension catalog right now. Please try again later.</div>`;
  }
  if(isFilteredView){
    return `<div class="empty-state">No extensions match your search.</div>`;
  }
  return `<div class="empty-state">
      No extensions have been submitted yet. Be the first — open an Issue
      on the YoukiStore repository with a link to your extension's repo
      to get it listed.
    </div>`;
}

document.getElementById('filters').addEventListener('click', (ev) => {
  const chip = ev.target.closest('.filter-chip');
  if(!chip) return;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  applyFilters();
});

document.getElementById('searchInput').addEventListener('input', applyFilters);

// Filtering/sorting/searching need resolved data (category, stars, name,
// desc) to work, so once the pointer list is loaded we resolve every
// manifest in the background (non-blocking, doesn't stop the initial
// lazy-loaded grid from painting immediately). Results land in
// manifestCache as they arrive; filters read from whatever's cached.
async function resolveAllInBackground(){
  await Promise.all(indexPointers.map(p => resolveExtension(p)));
}

function applyFilters(){
  const activeChip = document.querySelector('.filter-chip.active');
  const f = activeChip ? activeChip.dataset.filter : 'all';
  const q = document.getElementById('searchInput').value.trim().toLowerCase();

  // Only pointers whose manifest has been resolved (cached) so far can be
  // filtered/searched meaningfully. Once resolveAllInBackground() finishes,
  // this covers the whole catalog; before that, it covers whatever's been
  // scrolled past or resolved already.
  let resolvedList = indexPointers
    .filter(p => manifestCache.has(p.id))
    .map(p => manifestCache.get(p.id));

  if(f === 'top'){
    resolvedList.sort((a,b) => b.ghStars - a.ghStars);
  } else if(f === 'recent'){
    resolvedList.sort((a,b) => new Date(b.updatedAt || 0) - new Date(a.updatedAt || 0));
  }

  if(q){
    resolvedList = resolvedList.filter(e =>
      e.name.toLowerCase().includes(q) ||
      e.author.toLowerCase().includes(q)
    );
  }

  renderGrid(resolvedList.map(e => ({ id: e.id, repo: e.repo })));
}

// showDetail is async: it paints the header + sidebar instantly from
// cached/resolved data, then fetches README.md + media for just this one
// extension and fills them in once ready.
async function showDetail(id){
  const pointer = indexPointers.find(p => p.id === id);
  const e = await resolveExtension(pointer);

  document.getElementById('detail').innerHTML = `
    <div class="detail-head">
      ${iconHtml(e.iconUrl, e.icon, 'detail-icon')}
      <div class="detail-title-block">
        <h2 class="detail-title">${e.name}</h2>
        <div class="detail-sub">by ${e.author}${e.releaseTag ? ` · ${e.releaseTag}` : ''} · updated ${formatUpdated(e.updatedAt)}</div>
      </div>
      <div class="detail-actions">
        <a class="btn btn-primary" href="${e.releaseUrl || `https://github.com/${e.repo}/releases/latest`}">Download Extension</a>
        <a class="btn btn-ghost" href="https://github.com/${e.repo}" target="_blank" rel="noopener">${GH_MARK} View Source Code</a>
      </div>
    </div>
    <div class="detail-body">
      <div class="detail-main">
        <div class="shots" id="shotsWrap">
          <div class="shot">Loading screenshots…</div>
        </div>
        <div class="readme-label">
          <span class="readme-file-icon">▤</span> README.md
          <span class="readme-src">— pulled directly from the ${e.repo} repository on GitHub</span>
        </div>
        <div class="readme" id="readmeWrap"><p style="color:var(--text-dim);">Loading README.md…</p></div>
      </div>
      <div class="detail-side">
        <div class="side-block">
          <h4>Source Repository</h4>
          <div class="gh-box">
            <span class="gh-icon">${GH_MARK}</span>
            <div>
              <div class="gh-count">${formatStars(e.ghStars)} stars</div>
              <div class="gh-label">GitHub stars</div>
            </div>
            <a class="gh-link" href="https://github.com/${e.repo}" target="_blank" rel="noopener">Open</a>
          </div>
        </div>
        <div class="side-block">
          <h4>Info</h4>
          <div class="kv"><span>Last updated</span><span>${formatUpdated(e.updatedAt)}</span></div>
          <div class="kv"><span>Repository</span><span>${e.repo}</span></div>
        </div>
      </div>
    </div>
  `;
  document.getElementById('listing').style.display = 'none';
  document.getElementById('detailWrap').style.display = 'block';
  window.scrollTo(0,0);

  // Fetch this one extension's README + media gallery (a couple of
  // requests total, only for the extension being viewed).
  const { readmeHtml, media } = await loadExtensionDetail(e);

  const readmeEl = document.getElementById('readmeWrap');
  if(readmeEl) readmeEl.innerHTML = readmeHtml;

  const shotsEl = document.getElementById('shotsWrap');
  if(shotsEl){
    shotsEl.innerHTML = media.map((item, i) => {
      const failMsg = `Screenshot ${i+1} unavailable`;
      if(item.kind === 'video'){
        return `
          <div class="shot" data-idx="${i}">
            <video src="${item.url}" muted loop playsinline autoplay
                   onerror="this.parentElement.textContent='${failMsg}'; this.remove();"></video>
          </div>`;
      }
      // .gif files are handled by a plain <img> too — browsers animate
      // GIFs natively without needing <video>.
      return `
        <div class="shot" data-idx="${i}">
          <img src="${item.url}" alt="Screenshot ${i+1}"
               onerror="this.parentElement.textContent='${failMsg}'; this.remove();">
        </div>`;
    }).join('');
  }
}

function showListing(){
  document.getElementById('listing').style.display = 'block';
  document.getElementById('detailWrap').style.display = 'none';
}

// ===== Boot sequence =====
// 1. Load the lightweight index.json pointer list (or fall back to mock)
// 2. Paint skeleton cards immediately and start lazy-loading whichever
//    ones are actually visible
// 3. Resolve the rest of the catalog quietly in the background so
//    filters/search become fully accurate as data arrives
(async function boot(){
  await loadIndex();
  renderGrid(indexPointers);
  showListing();
  resolveAllInBackground(); // not awaited — runs quietly after first paint
})();
</script>

</body>
</html>
